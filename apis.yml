apis:
- name: StrongDM Admin API
  description: The StrongDM control-plane API for automating management of resources, accounts, roles, access grants, gateways, relays, secret
    stores, and audit logs. The transport is gRPC with request signing; StrongDM ships first-party SDKs (Go, Java, Python, Ruby, C#) that wrap
    it with REST-like ergonomics and handle signing, retries, and pagination. Authentication is an API access key plus secret key generated in
    the Admin UI.
  humanURL: https://docs.strongdm.com/
  baseURL: https://app.strongdm.com
