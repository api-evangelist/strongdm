aid: strongdm
name: StrongDM
description: >-
  StrongDM is a Zero Trust Privileged Access Management (PAM) platform that
  brokers and governs access to infrastructure — databases, servers, Kubernetes
  clusters, cloud resources, network devices, and internal web apps — through a
  central control plane. It enforces policy and authorization continuously with
  adaptive action controls, full session recording and audit, and no standing
  privileges. Automation is exposed through the StrongDM Admin API, a
  gRPC-based control-plane API that first-party SDKs (Go, Java, Python, Ruby,
  C#) wrap with REST-like ergonomics and request signing, plus a Terraform
  provider and the sdm command-line client. This profile was enriched by the
  API Evangelist pipeline from StrongDM's public developer surface.
