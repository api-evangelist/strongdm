description: >-
  The sdm command-line client — the local StrongDM client that authenticates a
  user, brokers connections to resources, and exposes administrative and audit
  helpers. The binary itself is catalogued in packages/strongdm-packages.yml;
  this artifact enumerates its command surface. sdm is the end-user/operator
  client; bulk automation of the control plane is done through the SDKs.
docs: https://docs.strongdm.com/
