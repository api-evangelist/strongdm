  - {name: logout, description: Log out of the local StrongDM client.}
  - {name: status, description: List resources and their connection status.}
  - {name: connect, description: Open a local port to a resource.}
  - {name: disconnect, description: Disconnect from a resource.}
  - {name: ssh, description: Connect to an SSH server through StrongDM.}
  - {name: ready, description: Report whether the local listener is ready.}
